<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #1f2937;
      background-color: #f9fafb;
    }
    header { margin-bottom: 40px; border-bottom: 2px solid #e5e7eb; padding-bottom: 16px; }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 4px 0 0; color: #6b7280; }
    .enlace-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .enlace-titulo { font-size: 1.25rem; font-weight: 700; text-decoration: none; color: #2563eb; }
    .enlace-titulo:hover { text-decoration: underline; }
    .meta { font-size: 0.85rem; color: #6b7280; margin-top: 4px; }
    .tag { background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-right: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
