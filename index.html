---
layout: default
title: Inicio
---

{% for post in site.posts %}
  <article class="enlace-card">
    <a class="enlace-titulo" href="{{ post.link }}" target="_blank" rel="noopener">
      {{ post.title }} ↗
    </a>
    <div class="meta">
      {{ post.date | date: "%d/%m/%Y" }}
      {% for tag in post.tags %}
        <span class="tag">#{{ tag }}</span>
      {% endfor %}
    </div>
    <div>
      {{ post.content }}
    </div>
  </article>
{% endfor %}
